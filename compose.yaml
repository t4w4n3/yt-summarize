---
name: "summarize-yt"

services:
  app:
    build:
      context: "."
      dockerfile: "image/Dockerfile"
    user: "node"
    command: ["/app/entrypoint-app.sh"]
    # Loopback-only: never publish on all interfaces. Expose via your own
    # reverse proxy / tunnel if remote access is needed.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
    volumes:
      - "jobs-data:/data"
    restart: "unless-stopped"
    # OCI-compatible: healthcheck is defined at compose level so the image
    # stays OCI (no Dockerfile HEALTHCHECK — which podman warns "ignored for OCI").
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "10s"

  worker:
    build:
      context: "."
      dockerfile: "image/Dockerfile"
    user: "node"
    command: ["/app/entrypoint-worker.sh"]
    environment:
      DATA_DIR: "/data"
      ARTIFACTS_DIR: "/artifacts"
      STT_MODEL: "${STT_MODEL:-microsoft/mai-transcribe-2}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openrouter}"
      LLM_MODEL: "${LLM_MODEL:-meta/muse-spark-1.3-contributor}"
      LLM_THINKING: "${LLM_THINKING:-high}"
      WORKER_POLL_MS: "${WORKER_POLL_MS:-2000}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS:-1800000}"
      STALE_AFTER_MS: "${STALE_AFTER_MS:-600000}"
      # Mullvad: yt-dlp sort par le tunnel via le proxy SOCKS5 du service vpn
      # (seul yt-dlp est concerné — le reste du worker reste en direct).
      MULLVAD_ENABLED: "${MULLVAD_ENABLED:-true}"
      MULLVAD_PROXY: "${MULLVAD_PROXY:-socks5h://127.0.0.1:1080}"
    volumes:
      - "jobs-data:/data"
      - "artifacts:/artifacts"
    secrets:
      - "openrouter_key"
    network_mode: "host"                      # host DNS/network; required on hosts without podman's aardvark-dns
    restart: "unless-stopped"
    # Runs as non-root `node` (image default); no HTTP endpoint to probe.
    healthcheck:
      disable: true

  vpn:
    build:
      context: "."
      dockerfile: "image/Dockerfile"
    user: "root"
    command: ["/app/entrypoint-vpn.sh"]
    # Tunnel WireGuard: nécessite NET_ADMIN + /dev/net/tun (confinés au netns du sidecar).
    cap_add:
      - "NET_ADMIN"
    devices:
      - "/dev/net/tun"
    # Sidecar Mullvad: tunnel WireGuard dans SON netns + proxy SOCKS5 local.
    # Le port 1080 n'est publié qu'en loopback (personne d'autre n'y accède).
    # Le SOCKS écoute sur 0.0.0.0 *dans* le netns du sidecar uniquement — le
    # forward host->container arrive sur l'IP du container (10.88.x), pas son
    # loopback, donc 127.0.0.1 dedans refuserait la connexion. Host reste 127.0.0.1.
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      SOCKS_HOST: "0.0.0.0"
      SOCKS_PORT: "1080"
    volumes:
      - "${HOME}/.local/mullvad-poc:/mullvad:ro"  # config WireGuard (clé privée, 0600 sur l'hôte)
    # unless-stopped: le sidecar redémarre après reboot / SIGTERM (cf. bug
    # 2026-09-01 où on-failure + exit 0 empêchait le restart, laissant
    # 127.0.0.1:1080 fermé → "Connection refused" côté worker). Sans config
    # l'entrypoint dort à l'infini au lieu d'exit 0 pour éviter la boucle.
    restart: "unless-stopped"
    # Pas d'endpoint HTTP sonnable pour ce sidecar.
    healthcheck:
      disable: true

# Pragmatic shared-model: app+worker share JobRow via jobs-data volume (SQLite jobs.db).
# Balanced today because volatility=low (supporting, single-team, same image, polling)
# — not VOLATILITY shields the Tight Model+High-Distance coupling.
# Revisit if queue/history UI lands — extract JobStorePort / published language.
volumes:
  jobs-data:
  artifacts:

secrets:
  openrouter_key:
    external: true
...
