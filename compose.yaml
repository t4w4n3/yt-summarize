name: summarize-yt

services:
  app:
    build:
      context: .
      dockerfile: image/Dockerfile
    command: ["/app/entrypoint-app.sh"]
    # Loopback-only: reachable solely via `tailscale serve` (https://<machine>.ts.net).
    # Never publish on all interfaces — this box has a public IP and no firewall.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
    volumes:
      - jobs-data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: image/Dockerfile
    command: ["/app/entrypoint-worker.sh"]
    environment:
      DATA_DIR: "/data"
      ARTIFACTS_DIR: "/artifacts"
      STT_MODEL: "${STT_MODEL:-mistralai/voxtral-mini-transcribe}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openrouter}"
      LLM_MODEL: "deepseek/deepseek-v4-flash-0731"
      LLM_THINKING: "${LLM_THINKING:-high}"
      WORKER_POLL_MS: "${WORKER_POLL_MS:-2000}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS:-1800000}"
      STALE_AFTER_MS: "${STALE_AFTER_MS:-600000}"
      # Mullvad: yt-dlp sort par le tunnel via le proxy SOCKS5 du service vpn
      # (seul yt-dlp est concerné — le reste du worker reste en direct).
      MULLVAD_ENABLED: "${MULLVAD_ENABLED:-true}"
      MULLVAD_PROXY: "${MULLVAD_PROXY:-socks5h://127.0.0.1:1080}"
    volumes:
      - jobs-data:/data
      - artifacts:/artifacts
      - ${HOME}/.secrets:/secrets:ro           # OpenRouter key, GPG-encrypted at rest (never decrypted on disk)
      - ${HOME}/.gnupg:/gnupg:ro               # passphrase-less GPG keyring (read-only; copied to writable $GNUPGHOME by entrypoint)

    network_mode: host                         # host DNS/network; required on hosts without podman's aardvark-dns
    restart: unless-stopped

  vpn:
    build:
      context: .
      dockerfile: image/Dockerfile
    command: ["/app/entrypoint-vpn.sh"]
    # Tunnel WireGuard: nécessite NET_ADMIN + /dev/net/tun (confinés au netns du sidecar).
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    # Sidecar Mullvad: tunnel WireGuard dans SON netns + proxy SOCKS5 local.
    # Le port 1080 n'est publié qu'en loopback (personne d'autre n'y accède).
    ports:
      - "127.0.0.1:1080:1080"
    volumes:
      - ${HOME}/.local/mullvad-poc:/mullvad:ro   # config WireGuard (clé privée, 0600 sur l'hôte)
    # on-failure + exit 0 de l'entrypoint: sans config, le service reste arrêté
    # proprement (clone frais) au lieu de boucler.
    restart: on-failure

volumes:
  jobs-data:
  artifacts:
