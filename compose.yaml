---
name: "summarize-yt"

services:
  app:
    build:
      context: "."
      dockerfile: "image/Dockerfile"
      target: "app"
    # Distroless app has no `node` user; numeric uid keeps the shared jobs-data uid.
    user: "1000"
    # Runtime hardening (mirrors the worker, minus the HOME redirect it needs
    # for yt-dlp/ffmpeg caches — the app writes nothing but jobs.db on the
    # jobs-data volume):
    # - drop all capabilities (app binds 8080 unprivileged, opens no device)
    # - no-new-privileges (defense in depth; distroless ships no setuid binaries)
    # - read-only image filesystem (only the jobs-data volume is writable)
    # - pids_limit (single Node process, no subprocess trees; headroom for
    #   Node/libuv/V8 threads while bounding fork bombs)
    # - /tmp tmpfs noexec/nosuid/nodev (SQLite temp files without exec from tmp)
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    pids_limit: 128
    # Resource bounds (todo.md P1): single Express process + SQLite only.
    mem_limit: "256m"
    cpus: 0.5
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"
    # Loopback-only: never publish on all interfaces. Expose via your own
    # reverse proxy / tunnel if remote access is needed.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
    volumes:
      - "jobs-data:/data"
    restart: "unless-stopped"
    # CMD (exec) healthcheck in a distroless image: works since podman-compose
    # >=1.5 serializes CMD arrays as JSON in --health-cmd (no /bin/sh involved).
    # (OCI-compatible: no Dockerfile HEALTHCHECK.)
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/app/src/infrastructure/inbound/healthcheck.ts", "http://127.0.0.1:8080/"]
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "10s"

  worker:
    build:
      context: "."
      dockerfile: "image/Dockerfile"
      target: "worker"
    user: "node"
    command: ["node", "/app/src/infrastructure/inbound/entrypoint-worker.ts"]
    # Runtime hardening (worker parses untrusted YouTube media via yt-dlp/ffmpeg):
    # - drop all capabilities (worker binds no port, needs no NET_ADMIN/CHOWN)
    # - no-new-privileges (setuid/setgid binaries reached from parsed media gain nothing)
    # - read-only image filesystem (only the two volumes + /tmp tmpfs are writable)
    # - pids_limit (bound subprocess trees from yt-dlp/ffmpeg)
    # - /tmp tmpfs noexec/nosuid/nodev (scratch without executing from tmp)
    # HOME is redirected onto the /tmp tmpfs: yt-dlp/ffmpeg/fontconfig write
    # caches under $HOME/.cache, which is read-only in the image otherwise.
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    pids_limit: 256
    # Resource bounds (todo.md P1): ffmpeg/yt-dlp working set on large
    # downloads; one job at a time, so the full host CPU quota is fine.
    mem_limit: "1536m"
    cpus: 2
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777"
    # Défauts des variables ci-dessous : src/shared/config.ts uniquement
    # (envVar / boundedInt). podman-compose 1.3.0 ne substitue que les variables
    # présentes dans .env ; pour une variable absente il passe au conteneur le
    # texte brut "${VAR}". config.ts le reconnaît et applique alors le défaut du
    # code. Ne remets donc jamais de défaut ici ("${VAR:-x}") : il serait
    # dupliqué, et silencieusement ignoré sur les installations existantes.
    environment:
      DATA_DIR: "/data"
      ARTIFACTS_DIR: "/artifacts"
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
      STT_MODEL: "${STT_MODEL}"
      # Retry borné des erreurs transitoires du provider STT (429 / 5xx, et le
      # 402 « in-flight budget » qui demande juste d'attendre).
      STT_RETRY_MAX_ATTEMPTS: "${STT_RETRY_MAX_ATTEMPTS}"
      STT_RETRY_BASE_DELAY_MS: "${STT_RETRY_BASE_DELAY_MS}"
      STT_RETRY_MAX_DELAY_MS: "${STT_RETRY_MAX_DELAY_MS}"
      STT_RETRY_AFTER_MAX_MS: "${STT_RETRY_AFTER_MAX_MS}"
      LLM_PROVIDER: "${LLM_PROVIDER}"
      LLM_MODEL: "${LLM_MODEL}"
      # Pin OpenRouter to one provider endpoint (slug) + quantization, so two
      # identical requests are not routed to a different backend.
      LLM_PROVIDER_PIN: "${LLM_PROVIDER_PIN}"
      LLM_QUANTIZATION: "${LLM_QUANTIZATION}"
      LLM_THINKING: "${LLM_THINKING}"
      WORKER_POLL_MS: "${WORKER_POLL_MS}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS}"
      # Plafond par vidéo de la taille de l'audio téléchargé, en octets
      # (500 MiB par défaut) : yt-dlp --max-filesize + vérification disque.
      MAX_DOWNLOAD_BYTES: "${MAX_DOWNLOAD_BYTES}"
      STALE_AFTER_MS: "${STALE_AFTER_MS}"
      # Mullvad: yt-dlp sort par le tunnel via le proxy SOCKS5 du service vpn
      # (seul yt-dlp est concerné — le reste du worker reste en direct).
      MULLVAD_ENABLED: "${MULLVAD_ENABLED}"
      MULLVAD_PROXY: "${MULLVAD_PROXY}"
    volumes:
      - "jobs-data:/data"
      - "artifacts:/artifacts"
    secrets:
      - "openrouter_key"
    # Bridge network (default): the worker parses untrusted media (yt-dlp/
    # ffmpeg) without host/LAN reachability. Needs podman's aardvark-dns for
    # service-name resolution (`vpn`); external DNS is forwarded by the
    # embedded DNS. Gated by `mise run test-dns` (scripts/dns-regression.sh)
    # — see todo.md P2. Do NOT re-add host networking without that gate.
    restart: "unless-stopped"
    # Runs as non-root `node` (image default); no HTTP endpoint to probe.
    healthcheck:
      disable: true

  vpn:
    build:
      context: "."
      dockerfile: "image/Dockerfile"
      target: "vpn"
    # Root only to bring the tunnel up (wg-quick); the Node entrypoint drops
    # to `node` before starting SOCKS5 or sleeping, so the long-lived process
    # is unprivileged. The image itself stays USER node (see Dockerfile).
    user: "root"
    command: ["node", "/app/src/vpn/entrypoint-vpn.ts"]
    # Runtime hardening (mirrors the worker, minus what wg-quick truly needs):
    # - drop all capabilities, re-add only NET_ADMIN (ip/wg netlink) and
    #   SETUID/SETGID (the entrypoint's root→node drop after wg-quick up).
    #   SOCKS5 on 1080 needs no NET_BIND_SERVICE; /dev/net/tun is granted via
    #   `devices`, not a capability.
    # - no-new-privileges (after the drop, setuid binaries gain nothing)
    # - read-only image filesystem (only the /tmp tmpfs + ro /mullvad volume
    #   are writable; the wg0.conf copy lives briefly on /tmp, then unlinked)
    # - pids_limit (wg-quick forks only a handful of processes)
    # - /tmp tmpfs noexec/nosuid/nodev (scratch without executing from tmp)
    cap_drop:
      - "ALL"
    cap_add:
      - "NET_ADMIN"
      - "SETUID"
      - "SETGID"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    pids_limit: 64
    # Resource bounds (todo.md P1): SOCKS5 proxying + wg-quick only.
    mem_limit: "128m"
    cpus: 0.25
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"
    # Tunnel WireGuard: nécessite /dev/net/tun (confiné au netns du sidecar).
    devices:
      - "/dev/net/tun:rwm"
    # Sidecar Mullvad: tunnel WireGuard dans SON netns + proxy SOCKS5 local.
    # Le port 1080 n'est publié qu'en loopback (personne d'autre n'y accède).
    # Le SOCKS écoute sur 0.0.0.0 *dans* le netns du sidecar uniquement — le
    # forward host->container arrive sur l'IP du container (10.88.x), pas son
    # loopback, donc 127.0.0.1 dedans refuserait la connexion. Host reste 127.0.0.1.
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      SOCKS_HOST: "0.0.0.0"
      SOCKS_PORT: "1080"
    volumes:
      - "${HOME}/.local/mullvad-poc:/mullvad:ro" # config WireGuard (clé privée, 0600 sur l'hôte)
    # unless-stopped: le sidecar redémarre après reboot / SIGTERM (cf. bug
    # 2026-09-01 où on-failure + exit 0 empêchait le restart, laissant
    # 127.0.0.1:1080 fermé → "Connection refused" côté worker). Sans config
    # l'entrypoint dort à l'infini au lieu d'exit 0 pour éviter la boucle.
    restart: "unless-stopped"
    # Pas d'endpoint HTTP sonnable pour ce sidecar.
    healthcheck:
      disable: true

# Pragmatic shared-model: app+worker share JobRow via jobs-data volume (SQLite jobs.db).
# Balanced today because volatility=low (supporting, single-team, same Dockerfile with
# three least-privilege targets, polling) — not VOLATILITY shields the Tight Model+High-
# Distance coupling. Revisit if queue/history UI lands — extract JobStorePort / published language.
volumes:
  jobs-data:
  artifacts:

secrets:
  openrouter_key:
    external: true
...
