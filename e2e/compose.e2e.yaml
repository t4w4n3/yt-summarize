---
# e2e/compose.e2e.yaml
# Container smoke-test stack, driven by `mise run test-containers`.
#
# The app service is the REAL shipped artifact (same image/Dockerfile and
# entrypoints as compose.yaml), but the worker runs the hermetic fake pipeline
# (e2e/fake-worker.ts) instead of the real one — so no yt-dlp/ffmpeg/gnupg and
# NO secret mounts. Job data is bind-mounted under e2e/.tmp/data (gitignored)
# so tests start clean and you can inspect it on the host after a failure.
#
# Standalone (not an overlay of compose.yaml) on purpose: podman-compose
# concatenates ports/volumes from base files, which would keep the worker's
# secrets mounts and clash with the dev stack's 8080 mapping.
name: "summarize-yt-e2e"

services:
  app:
    build:
      context: ".."
      dockerfile: "image/Dockerfile"
      target: "app"
    user: "1000"
    ports:
      - "127.0.0.1:${E2E_PORT:-4174}:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
    volumes:
      - "./.tmp/data:/data"
    restart: "no"

  # Fake worker needs only node (distroless app target already provides it, ENTRYPOINT
  # node + CMD override), so it reuses the app target instead of the fat worker target.
  worker:
    build:
      context: ".."
      dockerfile: "image/Dockerfile"
      target: "app"
    user: "1000"
    command: ["/app/e2e/fake-worker.ts"]
    environment:
      DATA_DIR: "/data"
      FAKE_WORKER_PORT: "4175"
      FAKE_WORKER_HOST: "0.0.0.0"
    volumes:
      - "./.tmp/data:/data"
      - "./fake-worker.ts:/app/e2e/fake-worker.ts:ro"
    ports:
      - "127.0.0.1:${E2E_WORKER_PORT:-4175}:4175"
    restart: "no"
    # CMD (exec) healthcheck, shell-less thanks to podman-compose >=1.5 JSON (see compose.yaml).
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "/app/src/infrastructure/inbound/healthcheck.ts", "http://127.0.0.1:4175/healthz"]
      interval: "10s"
      timeout: "3s"
      retries: 3
...
