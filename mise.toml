# Development toolchain, managed by mise.
# `mise install` / `mise run <task>` ensures this version is available to every task.
# Keep node in sync with image/Dockerfile (node:26-trixie-slim) and package.json engines (>=26).
# Keep pnpm in sync with package.json packageManager and the pnpm install line in image/Dockerfile.
[tools]
node = "26.13.1"
pnpm = "12.23.0"
# podman-compose >=1.5 (here latest 1.6) via pipx: its CMD healthchecks are
# serialized as JSON (no /bin/sh), which the distroless app healthcheck needs.
"pipx:podman-compose" = "1.6.0"
# Lint toolchain — used by the `lint*` mise tasks.
"npm:@biomejs/biome" = "2.6.6" # JS/TS/JSON: lint + format
shellcheck = "0.11.0"          # shell scripts
shfmt = "3.14.1"               # shell formatting
pipx = "1.18.16"               # backend for yamllint
yamllint = "1.38.0"            # YAML files
hadolint = "2.15.1"            # Containerfiles/Dockerfiles
trivy = "0.76.2"               # security scanner: vulns, secrets, misconfig
gitleaks = "8.30.1"            # secrets scanner (worktree + git history)
# Git hooks — hk (jdx) + pkl (config language for hk.pkl)
hk = "2.11.1"
pkl = "0.33.0"

[env]
# hk s'intègre avec mise : `hk install --mise` wrappe les hooks avec `mise x`
# pour que la toolchain mise soit disponible même sans `mise activate`.
HK_MISE = "1"

[hooks]
# Installe/met à jour les git hooks hk à chaque `mise install`, puis remplace
# les shims pre-commit/pre-push par la version qui garde la sortie de l'agent
# dans deux fichiers temporaires (scripts/hk-hook.sh).
postinstall = "hk install --mise && ./.mise/tasks/hooks.sh"
