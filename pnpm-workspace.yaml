# GHSA-g3hv-75wg-m249 (minimatch, modérée, DoS via globparts amplification) :
# dev-only, via archunit et @stryker-mutator/core, jamais dans l'image. Non
# corrigeable aujourd'hui — archunit 2.5.4 (la dernière) exige minimatch ^10,
# tandis que minimatch 11, première version corrigée, a supprimé l'API
# glob→RegExp (makeRe) qu'archunit appelle : l'override casse les 9 tests
# d'architecture. À retirer dès qu'archunit passe à minimatch 11.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
overrides:
  qs: ^6.16.0
  # GHSA-238p-pmpm-9mq7 (katex, low, prototype pollution) via
  # markdownlint-cli > markdownlint > micromark-extension-math : force la
  # version patchée (le math rendering de markdownlint n'en a pas besoin,
  # mais le lockfile doit passer pnpm audit --audit-level=low).
  katex: ">=0.18.2"
